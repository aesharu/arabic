<script>
  // Apply the saved theme and language before the first paint, so the page doesn't flash.
  try {
    const p = JSON.parse(localStorage.getItem(localStorage.getItem("najdi-profile") === "teacher" ? "najdi-v2-dima" : "najdi-v2") || "{}").prefs || {};
    if (["saudi", "saudi-dark", "light", "dark"].includes(p.theme)) document.documentElement.dataset.theme = p.theme;
    if (p.lang === "najdi" || p.lang === "msa") { document.documentElement.dir = "rtl"; document.documentElement.lang = "ar"; }
    else if (p.lang === "uk") document.documentElement.lang = "uk";
  } catch {}
  // The welcome screen, every time the page loads (js/core/welcome.js) — except right after choosing a new profile.
  try { if (sessionStorage.getItem("najdi-welcomed") === "reload") sessionStorage.removeItem("najdi-welcomed"); else document.documentElement.dataset.welcome = "1"; } catch { document.documentElement.dataset.welcome = "1"; }
</script>
